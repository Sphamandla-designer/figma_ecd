name: figma-upload
on:
  workflow_dispatch:
  push:
    branches: [claude/elp-screens-descriptions-tk2qap]
    paths: [figma-screens/urls.tsv]
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: POST screen PNGs to Figma single-use upload URLs
        run: |
          set -e
          if [ ! -f figma-screens/urls.tsv ]; then echo "no urls.tsv"; exit 1; fi
          ok=0; fail=0
          while IFS=$'\t' read -r file url; do
            [ -z "$file" ] && continue
            ctype=image/png
            case "$file" in *.svg) ctype=image/svg+xml;; esac
            code=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' -X POST -F "file=@figma-screens/$file;type=$ctype" "$url") || code=err
            if [ "$code" = "200" ]; then
              ok=$((ok+1))
            else
              fail=$((fail+1)); echo "FAIL $file $code"; cat /tmp/resp.txt || true; echo
            fi
          done < figma-screens/urls.tsv
          echo "uploaded ok=$ok fail=$fail"
          [ "$fail" = "0" ]
